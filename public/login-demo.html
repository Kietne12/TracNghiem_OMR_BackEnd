<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Demo - Lấy Bearer Token</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 16px;
            background: #f5f5f5;
            border-radius: 6px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-weight: 500;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .result {
            margin-top: 25px;
            display: none;
        }

        .result-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .result-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }

        pre {
            font-size: 12px;
            line-height: 1.4;
            color: #333;
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .token-box {
            background: #f0f7ff;
            border: 2px dashed #667eea;
            border-radius: 6px;
            padding: 12px;
            margin-top: 15px;
            display: none;
        }

        .token-box.show {
            display: block;
        }

        .token-label {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }

        .token-value {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            color: #333;
            margin-bottom: 10px;
        }

        .btn-copy {
            width: 100%;
            padding: 8px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #564eda;
        }

        .btn-copy.copied {
            background: #4caf50;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
            padding: 12px;
            background: #fafafa;
            border-radius: 4px;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Login</h1>
        <p class="subtitle">Đăng nhập để lấy Bearer Token cho OMR upload</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" placeholder="VD: giangvien" value="giangvien" required>
            </div>

            <div class="form-group">
                <label for="password">Mật Khẩu *</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" value="123456" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">🚀 Login</button>
        </form>

        <div class="status" id="status"></div>

        <div class="token-box" id="tokenBox">
            <div class="token-label">📋 Bearer Token (Copy để dùng cho OMR upload)</div>
            <div class="token-value" id="tokenValue"></div>
            <button class="btn-copy" id="copyBtn">📋 Copy Token</button>
            <div class="help-text">
                ✓ Token đã copy vào clipboard<br>
                → Mở <a href="/demo/omr-upload-demo.html" target="_blank">omr-upload-demo.html</a><br>
                → Paste token vào field "Bearer Token"<br>
                → Upload phiếu OMR
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const status = document.getElementById('status');
        const tokenBox = document.getElementById('tokenBox');
        const tokenValue = document.getElementById('tokenValue');
        const copyBtn = document.getElementById('copyBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showStatus('Vui lòng điền username và mật khẩu', 'error');
                return;
            }

            showStatus('Đang đăng nhập...', 'loading');
            loginBtn.disabled = true;
            tokenBox.classList.remove('show');

            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                console.log('Login response:', data);
                console.log('Token:', data.token);

                if (response.ok && data.token) {
                    showStatus('✓ Đăng nhập thành công!', 'success');
                    tokenValue.textContent = data.token;
                    tokenBox.classList.add('show');
                    loginBtn.disabled = false;
                } else {
                    showStatus('✗ Lỗi: ' + (data.message || 'Đăng nhập thất bại'), 'error');
                    loginBtn.disabled = false;
                }
            } catch (err) {
                showStatus('✗ Lỗi kết nối: ' + err.message, 'error');
                loginBtn.disabled = false;
            }
        });

        copyBtn.addEventListener('click', () => {
            const token = tokenValue.textContent;
            navigator.clipboard.writeText(token).then(() => {
                copyBtn.textContent = '✓ Đã copy!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '📋 Copy Token';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('Lỗi copy: ' + err.message);
            });
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status ' + type;
        }
    </script>
</body>
</html>
