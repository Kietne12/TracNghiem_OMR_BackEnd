<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMR Upload Demo - Quét Phiếu Trắc Nghiệm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        .file-label {
            display: inline-block;
            background: #f5f5f5;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 8px;
        }

        .file-label:hover {
            background: #efefef;
        }

        .btn-upload {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-upload:active {
            transform: translateY(0);
        }

        .btn-upload:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 16px;
            background: #f5f5f5;
            border-radius: 6px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-weight: 500;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .progress-container {
            margin-top: 15px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
            text-align: center;
        }

        .result {
            margin-top: 25px;
            display: none;
        }

        .result-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .result-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }

        pre {
            font-size: 12px;
            line-height: 1.4;
            color: #333;
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Quét OMR</h1>
        <p class="subtitle">Upload phiếu trắc nghiệm để quét tự động</p>
        <p style="font-size: 12px; color: #d32f2f; margin-bottom: 20px; padding: 10px; background: #ffebee; border-radius: 4px;">
            ⚠️ Cần Bearer Token! Hãy <a href="/demo/login-demo.html" style="color: #d32f2f; font-weight: 600;">Login tại đây</a> để lấy token
        </p>

        <form id="uploadForm">
            <div class="form-group">
                <label for="examId">Mã Kỳ Thi (Exam ID) *</label>
                <input type="number" id="examId" placeholder="VD: 1, 2, 3..." required>
            </div>

            <div class="form-group">
                <label for="token">Bearer Token *</label>
                <input type="text" id="token" placeholder="Paste token của bạn tại đây..." required>
            </div>

            <div class="form-group">
                <label for="manualMssv">MSSV Override (tuỳ chọn)</label>
                <input type="text" id="manualMssv" placeholder="VD: 00001 - dùng khi máy quét đọc sai MSSV">
            </div>

            <div class="form-group">
                <label for="manualMaDe">Mã Đề Override (tuỳ chọn)</label>
                <input type="text" id="manualMaDe" placeholder="VD: 001 - dùng khi máy quét đọc sai mã đề">
            </div>

            <div class="form-group">
                <label for="fileInput">Chọn Ảnh Phiếu OMR (.jpg, .png) *</label>
                <input type="file" id="fileInput" accept="image/*" required>
                <span class="file-label" id="fileLabel">Chưa chọn file</span>
            </div>

            <button type="submit" class="btn-upload" id="uploadBtn">🚀 Upload & Quét</button>
        </form>

        <div class="status" id="status"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text"><span id="progressPercent">0</span>%</div>
        </div>

        <div class="result" id="result">
            <div class="result-title">📊 Kết Quả</div>
            <div class="result-box">
                <pre id="resultContent"></pre>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const result = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');

        let loadingInterval = null;
        let dotCount = 0;

        // File input label update
        fileInput.addEventListener('change', (e) => {
            const fileName = e.target.files[0]?.name || 'Chưa chọn file';
            fileLabel.textContent = '✓ ' + fileName;
        });

        // Start loading animation
        const startLoading = () => {
            dotCount = 0;
            loadingInterval = setInterval(() => {
                dotCount = (dotCount + 1) % 4;
                const dots = '.'.repeat(dotCount);
                status.textContent = 'Đang upload' + dots;
            }, 400);
        };

        // Stop loading animation
        const stopLoading = () => {
            if (loadingInterval) clearInterval(loadingInterval);
            loadingInterval = null;
        };

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const examId = document.getElementById('examId').value;
            const token = document.getElementById('token').value;
            const manualMssv = document.getElementById('manualMssv').value;
            const manualMaDe = document.getElementById('manualMaDe').value;
            const file = fileInput.files[0];

            if (!examId || !token || !file) {
                showStatus('Vui lòng điền đủ thông tin', 'error');
                return;
            }

            // Clear previous results
            result.classList.add('hidden');
            resultContent.textContent = '';

            // Prepare form data
            const formData = new FormData();
            formData.append('omr_image', file);  // Field name must match backend multer config
            if (manualMssv && manualMssv.trim()) {
                formData.append('mssv_override', manualMssv.trim());
            }
            if (manualMaDe && manualMaDe.trim()) {
                formData.append('ma_de_override', manualMaDe.trim());
            }

            // Show progress
            showStatus('Đang chuẩn bị...', 'loading');
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            progressPercent.textContent = '0';
            uploadBtn.disabled = true;
            startLoading();

            try {
                // Create XMLHttpRequest for better progress tracking
                const xhr = new XMLHttpRequest();

                // Track upload progress
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        progressFill.style.width = percentComplete + '%';
                        progressPercent.textContent = percentComplete;
                    }
                });

                // Handle response
                xhr.addEventListener('load', () => {
                    stopLoading();
                    progressContainer.style.display = 'none';
                    uploadBtn.disabled = false;

                    try {
                        const responseData = JSON.parse(xhr.responseText);
                        
                        if (xhr.status === 200 || xhr.status === 201) {
                            showStatus('✓ Quét thành công!', 'success');
                            displayResult(responseData);
                        } else if (xhr.status === 202) {
                            showStatus('⚠ Quét xong nhưng cần xác nhận MSSV', 'error');
                            displayResult(responseData);
                        } else {
                            const errorMsg = responseData.message || 'Lỗi không xác định';
                            showStatus('✗ ' + errorMsg, 'error');
                            displayResult({ error: errorMsg, status: xhr.status, fullResponse: responseData });
                        }
                    } catch (parseErr) {
                        // Response không phải JSON (có thể là HTML error page)
                        showStatus('✗ Lỗi server: ' + xhr.status, 'error');
                        displayResult({ 
                            error: 'Server error - raw response:', 
                            status: xhr.status,
                            responseType: xhr.responseText.substring(0, 200)
                        });
                    }
                });

                // Handle error
                xhr.addEventListener('error', () => {
                    stopLoading();
                    progressContainer.style.display = 'none';
                    uploadBtn.disabled = false;
                    showStatus('✗ Lỗi kết nối', 'error');
                });

                // Send request
                xhr.open('POST', `/api/exams/${examId}/omr/upload`);
                xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                xhr.send(formData);
            } catch (err) {
                stopLoading();
                progressContainer.style.display = 'none';
                uploadBtn.disabled = false;
                showStatus('✗ Lỗi: ' + err.message, 'error');
            }
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function displayResult(data) {
            resultContent.textContent = JSON.stringify(data, null, 2);
            result.classList.remove('hidden');
        }
    </script>
</body>
</html>
